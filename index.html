<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Digital Clock & Factorial Calculator</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body id="theme-body" class="d-flex align-items-center justify-content-center vh-100 bg-dark text-light">
  <div class="container text-center">
    <!-- Theme Selector -->
    <div class="row justify-content-center mb-4">
      <div class="col-12 d-flex justify-content-end">
        <select id="theme-selector" class="form-select w-auto" onchange="changeTheme()">
            <option value="dark" selected>Dark Theme</option>
            <option value="light">Light Theme</option>
            <option value="retro">Retro Theme</option>
            <option value="ocean">Ocean Theme</option>
            <option value="sunset">Sunset Theme</option>
            <option value="cyberpunk">Cyberpunk Theme</option>
          </select>
          
      </div>
    </div>

    <!-- Main Content: Clock and Factorial Section -->
    <div class="row align-items-center justify-content-center g-4">
      <!-- Clock Section -->
      <div class="col-lg-5">
        <div class="card border-danger shadow-lg">
          <div class="card-body">
            <h5 class="card-title text-danger mb-3">Digital Clock</h5>
            <div id="clock" class="display-1 fw-bold text-danger text-monospace"></div>
          </div>
        </div>
      </div>

      <!-- Factorial Calculator Section -->
      <div class="col-lg-5">
        <div class="card border-primary shadow-lg">
          <div class="card-body">
            <h5 class="card-title text-primary mb-3">Factorial Calculator</h5>
            <div class="mb-3">
              <label for="number" class="form-label">Enter a number:</label>
              <input type="number" id="number" class="form-control" placeholder="Enter a positive integer" min="0">
            </div>
            <div class="d-flex justify-content-center gap-3">
              <button class="btn btn-primary" onclick="calculateFactorial('iterative')">Iterative Method</button>
              <button class="btn btn-secondary" onclick="calculateFactorial('recursive')">Recursive Method</button>
            </div>
            <div id="result" class="mt-3 fw-bold"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
